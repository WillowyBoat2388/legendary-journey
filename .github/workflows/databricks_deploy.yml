name: Sync Git Folder

concurrency: prod_environment

on:
  push:
    branches:
      # Set your base branch name here
      - git-folder-cicd-example, main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 'Update git folder'
    # environment: Prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      # DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      # DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}

      
    steps:
      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            export DATABRICKS_HOST=$(az keyvault show --name ${{ secrets.AZURE_KEYVAULT_NAME }} --query "properties.vaultUri" --output tsv)
            export DATABRICKS_CLIENT_ID=$(az keyvault secret show --name ${{ secrets.AZURE_KEYVAULT_NAME }} --query "properties.vaultUri" --output tsv)
            export DATABRICKS_WORKSPACE=$(az keyvault show --name ${{ secrets.AZURE_KEYVAULT_NAME }} --query "properties.vaultUri" --output tsv)

      - name: Set Databricks Host and Client ID
        run: |
          cp include/terraform-module/outputs.json .github/workflows/outputs.json
          echo "DATABRICKS_HOST=$(outputs.json)" >> $GITHUB_ENV
          echo "DATABRICKS_CLIENT_ID=$(outputs.json)" >> $GITHUB_ENV

      - uses: databricks/setup-cli@main
      - name: Update git folder
        # Set your workspace path and branch name here
        run: databricks repos update /Workspace/ong_workflow --branch main
